name: CI

# Validation only. Every release concern — versioning, tagging, signing,
# uploading — lives in release.yml. Keeping them apart is what lets this
# workflow run for Dependabot, whose events get an empty secrets context.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test -- --coverage
      - name: Coverage summary
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total.lines.pct;
            console.log(`Line coverage: ${t}%`);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### App line coverage: ${t}%\n`);
          '
      - run: node --test .github/scripts/test-release-draft.cjs

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - run: npm run format:check
        working-directory: worker
      - run: npm test -- --coverage
        working-directory: worker
      - name: Coverage summary
        run: |
          node -e '
            const t = require("./worker/coverage/coverage-summary.json").total.lines.pct;
            console.log(`Line coverage: ${t}%`);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Worker line coverage: ${t}%\n`);
          '

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget libssl-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri

  # Drives the real debug app through tauri-driver. Linux only: tauri-driver
  # has no macOS support. All GIF and updater traffic goes to a local stub
  # (see e2e/ and docs/e2e.md), so this needs no secrets or network APIs.
  e2e:
    runs-on: ubuntu-22.04
    env:
      TAURI_DRIVER_VERSION: "2.1.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget libssl-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev webkit2gtk-driver xvfb

      - id: tauri-driver-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-${{ runner.os }}-${{ env.TAURI_DRIVER_VERSION }}

      - if: steps.tauri-driver-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --locked --version "$TAURI_DRIVER_VERSION"

      - run: npm ci

      - run: npm ci && xvfb-run -a npm test
        working-directory: e2e

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust-target: aarch64-apple-darwin
          - platform: macos-15-intel
            rust-target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            rust-target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget libssl-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - run: npm ci

      # No signing key and no updater artifacts. createUpdaterArtifacts is
      # false in the committed config, so this needs no secrets at all and
      # therefore passes on Dependabot PRs, which cannot read them.
      - name: Build bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx tauri

      - uses: actions/upload-artifact@v4
        with:
          name: gifbar-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
